name: Virales de Instagram
# Busca los reels y carruseles de viajes que rindieron mucho más que lo normal de su cuenta.
# Corre los lunes 9:00 de Uruguay y a mano. Guarda virales/AAAA-MM-DD.md en la rama publicador.
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: virales-instagram
jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publicador
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Buscar virales
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node virales.mjs
      - name: Guardar
        run: |
          git config user.name "publicador-egv"
          git config user.email "publicador@users.noreply.github.com"
          git add virales
          git commit -qm "virales $(TZ=America/Montevideo date +%F)" || exit 0
          git pull -q --rebase origin publicador && git push -q origin HEAD:publicador
